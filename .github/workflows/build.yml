name: Build & Package

on:
  push:
    branches: [main]
    # Release tags are the bare version number (0.9.0), no "v" prefix.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'
  # qtspeech (read-aloud, OS voices) and qtmultimedia (local AI voice playback
  # / audio export) are optional at build time but must be present here for
  # release builds to ship those features.
  QT_MODULES: 'qtwebengine qtwebchannel qtpositioning qtspeech qtmultimedia'

jobs:
  # ---------------------------------------------------------------- Linux ---
  linux:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1   # CI runners lack FUSE
    steps:
      - uses: actions/checkout@v4

      - name: Install build / WebEngine / AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libasound2 libfuse2 fuse desktop-file-utils \
            libspeechd2

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Package (AppImage + deb/tgz)
        run: ./scripts/package-linux.sh
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: spindle-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS ---
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Package (.dmg)
        # bash <file> instead of ./<file>: does not rely on the exec bit
        # being recorded in git for the script.
        run: bash ./scripts/package-macos.sh
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
          # The runner has no Developer ID certificate or notary credentials,
          # so package-macos.sh would stop before building. With notarization
          # skipped and no identity found, it ad-hoc signs the app and leaves
          # the .dmg unsigned. Signed, notarized packages are made by hand.
          SKIP_NOTARIZE: '1'

      - uses: actions/upload-artifact@v4
        with:
          name: spindle-macos
          path: dist/*.dmg
          if-no-files-found: error

  # -------------------------------------------------------------- Windows ---
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      # The packaging scripts are packaging-only by design (they never rebuild,
      # so a code signature on spindle.exe survives) — build first.
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -QtPrefix $env:QT_ROOT_DIR

      - name: Package (portable zip)
        shell: pwsh
        run: ./scripts/package-windows.ps1

      # Inno Setup 6 is preinstalled on the windows runner image. These
      # installers are unsigned: the signing certificate lives on a hardware
      # token, so `-Sign` only works on a machine with the token attached.
      - name: Package (installer)
        shell: pwsh
        run: ./scripts/package-windows-inno.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: spindle-windows
          path: |
            dist/*.zip
            dist/Spindle-*-windows-*.exe
          if-no-files-found: error

  # -------------------------------------------------------------- Release ---
  release:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Releases are also made by hand with signed packages (the signing
      # certificate never reaches CI). overwrite_files: false keeps a signed
      # file already attached from being replaced by CI's unsigned one of the
      # same name, and without generate_release_notes an existing hand-written
      # body is left as it is (the action would append generated notes to it).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          overwrite_files: false
